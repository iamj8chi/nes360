<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Safari VR 360° por la sabana del Chaco: encontrá y salvá a los 6 animales nativos amenazados."
    />
    <meta name="theme-color" content="#1f3a24" />
    <title>No Estan Solos 360° VR | Zet Studios</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script type="module" src="/src/main.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .hint {
        position: absolute;
        left: 8px;
        top: 8px;
        color: white;
        font-family: sans-serif;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 8px;
        border-radius: 4px;
        z-index: 10;
      }

      /* Desktop animal info card — fixed to the right corner, hidden by default.
         El arte de la ficha ya trae su propio panel (fondo, título, etiquetas),
         así que el contenedor no aporta chrome: solo posición y transición. */
      .info-card {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%) translateX(20px);
        width: 320px;
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      .info-card--visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) translateX(0);
      }
      .info-card__art {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
      }
      /* El arte de la ficha deja un hueco vacío arriba del nombre; el icono
         hexagonal del animal va ahí. Medidas tomadas del SVG (viewBox 318):
         el contenido arranca en y≈117.6, así que el icono ocupa y 16..100
         (lado 84 → 26.4%, top 5.03%). */
      .info-card__icon {
        position: absolute;
        top: 5.03%;
        left: 50%;
        transform: translateX(-50%);
        width: 26.4%;
        height: auto;
      }
      /* El botón queda por encima del arte: disco oscuro para que no se pierda. */
      .info-card__close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .info-card__close:hover {
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      WASD / flechas para moverte. Haz click al cartel de Safari y busca los 6
      animales.
    </div>

    <!-- Desktop animal info card (populated/toggled by the animal-info-card component) -->
    <div id="animalInfoCard" class="info-card" aria-hidden="true">
      <button
        id="animalInfoCardClose"
        class="info-card__close"
        aria-label="Cerrar"
        type="button"
      >
        ✕
      </button>
      <img id="animalInfoCardImg" class="info-card__art" src="" alt="" />
      <img id="animalInfoCardIcon" class="info-card__icon" src="" alt="" />
    </div>

    <!-- fog="type: exponential; color: #FFD178; density: 0.02"-->>

    <a-scene
      fog="type: exponential; color: #f5dca6; density: 0.02"
      background="color: #FFD178"
      renderer="antialias: true; 
                colorManagement: true; 
                sortObjects: true; 
                physicallyCorrectLights: false;
                powerPreference: high-performance;
                precision: mediump;
                logarithmicDepthBuffer: false"
      vr-mode-ui="enabled: true"
      quest-immersive-launch
      webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
      inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js"
      shadow-control="enabled: false"
      audio-unlock
      collision-manager
      game-modes
      animal-highlighter
      hold-to-restart
    >
      <!-- Safari Game Manager -->
      <a-entity
        id="gameManager"
        safari-game-manager="timeLimit: 120"
        environment-degradation
      ></a-entity>

      <a-assets>
        <!-- Model assets -->
        <a-asset-item
          id="samuuModel"
          src="assets/models/samuu.glb"
        ></a-asset-item>
        <a-asset-item
          id="samuuCanopyModel"
          src="assets/models/samuu-canopy.glb"
        ></a-asset-item>
        <a-asset-item
          id="jaguareteModel"
          src="assets/models/jaguarete.glb"
        ></a-asset-item>
        <a-asset-item
          id="nanduModel"
          src="assets/models/nandu.glb"
        ></a-asset-item>
        <a-asset-item
          id="flamengoModel"
          src="assets/models/flamengo.glb"
        ></a-asset-item>
        <a-asset-item
          id="jurumiModel"
          src="assets/models/jurumi.glb"
        ></a-asset-item>
        <a-asset-item

        ></a-asset-item>
        <a-asset-item

          src="assets/models/tatu.glb"
        ></a-asset-item>
        <a-asset-item
          id="islaModel"
          src="assets/models/isla.glb"
        ></a-asset-item>
        <a-asset-item
          id="pastoModel"
          src="assets/models/pasto.glb"
        ></a-asset-item>
        <a-asset-item
          id="karandayTroncoModel"
          src="assets/models/karanday-tronco.glb"
        ></a-asset-item>
        <a-asset-item
          id="karandayHojaModel"
          src="assets/models/karanday-hoja.glb"
        ></a-asset-item>

        <!-- UI assets for animal tracker -->
        <img id="trackerBg" src="assets/ui/tracker-background.png" />
        <img id="flamengoCheck" src="assets/ui/flamengo-check.png" />
        <img id="flamengoUncheck" src="assets/ui/flamengo-uncheck.png" />
        <img id="jaguareteCheck" src="assets/ui/jaguarete-check.png" />
        <img id="jaguareteUncheck" src="assets/ui/jaguarete-uncheck.png" />
        <img id="nanduCheck" src="assets/ui/nandu-check.png" />
        <img id="nanduUncheck" src="assets/ui/nandu-uncheck.png" />
        <img id="jurumiCheck" src="assets/ui/jurumi-check.png" />
        <img id="jurumiUncheck" src="assets/ui/jurumi-uncheck.png" />
        <img id="taguaCheck" src="assets/ui/tagua-check.png" />
        <img id="taguaUncheck" src="assets/ui/tagua-uncheck.png" />
        <img id="tatuCheck" src="assets/ui/tatu-check.png" />
        <img id="tatuUncheck" src="assets/ui/tatu-uncheck.png" />

        <!-- Cartel images -->
        <img id="cartelSafari" src="assets/img/cartel-safari.png" />
        <img id="cartelMain" src="assets/img/cartel-main.png" />
        <img id="cartelCreditos" src="assets/img/cartel-creditos.png" />

        <!-- Fichas de animal: el arte trae el texto horneado, una imagen por
             especie. Ver animal-info-card + ANIMAL_INFO (texto accesible). -->
        <img id="flamengoCartel" src="assets/ui/cards/flamengo-cartel.png" />
        <img id="jaguareteCartel" src="assets/ui/cards/jaguarete-cartel.png" />
        <img id="nanduCartel" src="assets/ui/cards/nandu-cartel.png" />
        <img id="jurumiCartel" src="assets/ui/cards/jurumi-cartel.png" />
        <img id="taguaCartel" src="assets/ui/cards/tagua-cartel.png" />
        <img id="tatuCartel" src="assets/ui/cards/tatu-cartel.png" />

        <!-- Audio assets -->
        <audio
          id="ambienceSound"
          src="assets/sfx/ambience.mp3"
          preload="auto"
        ></audio>
        <audio id="tatuSound" src="assets/sfx/tatu.mp3" preload="auto"></audio>
        <audio
          id="flamengoSound"
          src="assets/sfx/flamengo.mp3"
          preload="auto"
        ></audio>
        <audio
          id="jaguareteSound"
          src="assets/sfx/jaguarete.mp3"
          preload="auto"
        ></audio>

        <!-- Game sound effects -->
        <audio
          id="gameStartSound"
          src="assets/sfx/game-start.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameFoundSound"
          src="assets/sfx/game-found.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameWinSound"
          src="assets/sfx/game-win.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameOverSound"
          src="assets/sfx/game-over.mp3"
          preload="auto"
        ></audio>
        <audio id="fireSound" src="assets/sfx/fire.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Sky -->
      <a-sky id="sky" color="#87ceeb"></a-sky>

      <!-- Ambient Sound - plays everywhere in the background -->
      <a-entity
        id="ambientSound"
        sound="src: #ambienceSound; autoplay: true; loop: true; volume: 0.3; positional: false"
        position="0 0 0"
      ></a-entity>

      <!-- Game Sound Effects (triggered by events) -->
      <a-entity id="gameSoundEffects" position="0 0 0">
        <a-entity
          id="soundGameStart"
          sound="src: #gameStartSound; autoplay: false; volume: 0.6; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameFound"
          sound="src: #gameFoundSound; autoplay: false; volume: 0.5; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameWin"
          sound="src: #gameWinSound; autoplay: false; volume: 0.7; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameOver"
          sound="src: #gameOverSound; autoplay: false; volume: 0.6; positional: false"
        ></a-entity>
        <!-- Burning-forest loop: environment-degradation plays it during a Safari
             round and ramps its volume up with the timer (see component). -->
        <a-entity
          id="soundFire"
          sound="src: #fireSound; autoplay: false; loop: true; volume: 0; positional: false"
        ></a-entity>
      </a-entity>

      <!-- Lighting: hemisphere ambient + directional sun (shadows enabled in script) -->
      <a-entity
        light="type: hemisphere; color: #ffffff; groundColor: #556655; intensity: 0.8"
      ></a-entity>

      <a-entity
        id="sun"
        light="type: directional; color: #ffffff; intensity: 1.3; castShadow: true"
        position="0 50 0"
        rotation="0 0 0"
      ></a-entity>

      <!-- Ocean using a-ocean component 
      <a-ocean
        width="500"
        depth="500"
        density="20"
        opacity="1"
        position="30 -0.5 -10"
        color="#16e9aa"
      ></a-ocean> -->

      <!-- Ground (slightly raised) 
      <a-entity
        geometry="primitive: circle; radius: 50; segments: 32"
        material="color: #96d165"
        shadow="receive: true"
        rotation="-90 0 0"
        position="0 0.01 0"
      ></a-entity> -->

      <!-- Player Collision Boundary Ring -->
      <a-entity
        id="boundaryRing"
        visible="false"
        geometry="primitive: cylinder; radius: 26.7; height: 10; openEnded: true; thetaStart: 0; thetaLength: 500"
        material="color: #0066ff; transparent: true; opacity: 0.2; side: double"
        position="0 5 0"
        static-body
      ></a-entity>

      <!-- Marcador de destino del teleport por gestos (pinch-teleport). Hijo de la escena
           para que sus coords locales coincidan con las del mundo. Oculto por defecto. -->
      <a-entity
        id="teleportMarker"
        visible="false"
        geometry="primitive: ring; radiusInner: 0.25; radiusOuter: 0.35; segmentsTheta: 32"
        material="shader: flat; color: #00FF88; opacity: 0.8; transparent: true; side: double"
        rotation="-90 0 0"
        position="0 0.02 0"
      ></a-entity>

      <!-- Safari Game Control Orbs -->
      <a-entity id="carteles" position="0 1.5 -5">
        <!-- Safari Cartel -->
        <a-entity
          id="startCartel"
          shadow="receive: false"
          position="1.903 0.29 0.038"
          collision-cube="width: 1; depth: 0.3; height: 10; offsetY: 0"
        >
          <!-- render-order: este PNG transparente se apila sobre otro (#mainCartel).
               Sin un orden fijo, three.js los ordena por la profundidad del ORIGEN
               de cada objeto y al girar la cabeza hacia este botón (está ~21° a la
               derecha) el orden se invierte: se dibuja primero, escribe profundidad
               y agujerea el cartel de atrás — por sus zonas transparentes se veía el
               cielo. El z-offset no alcanza porque el orden depende del ángulo de
               cámara. Es render-order y no render-on-top a propósito: el depth test
               tiene que seguir activo para que los árboles lo sigan tapando. -->
          <a-image
            id="startCartelImg"
            geometry="width: 1.9; height: 1"
            class="clickable orb-start"
            src="#cartelSafari"
            position="0 0 0"
            width="1"
            height="1.4"
            shadow="cast: true"
            material="shader: flat; transparent: true"
            render-order="order: 1"
            orb-controller
          ></a-image>
          <a-box
            position="0 0 -0.03"
            scale="1.95 1.05 0.05"
            color="#a85432"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- Main Cartel -->

      <a-entity
        id="mainCartelGrande"
        position="0 0 -5"
        collision-cube="width: 7; depth: 0.3; height: 16 offsetY: -10"
      >
        <!-- Decorative welcome banner (no longer interactive: flight is now always-on,
             so there is no Vuelo mode to exit). -->
        <a-image
          id="mainCartel"
          geometry="width: 7"
          src="#cartelMain"
          position="0 3 0"
          width="7"
          height="4"
          shadow="cast: true"
          material="shader: flat; transparent: true"
        ></a-image>
        <a-box
          position="0 3 -0.03"
          scale="6.5 3.5 0.05"
          color="#a85432"
        ></a-box>
        <!-- Anverso: créditos del proyecto, visible al rodear el cartel.
             - rotation 0 180 0: sin esto el texto sale espejado (y el plano,
               que es FrontSide, no se vería desde atrás).
             - Ninguna de las dos caras lleva `side: double` a propósito: así
               cada una se ve solo desde su lado y no se superponen.
             - z -0.16 y no -0.06: el a-box marrón ocupa -0.055..-0.005 y
               #debugToggleCube -0.097..-0.037; más cerca habría z-fighting. -->
        <a-image
          id="mainCartelBack"
          src="#cartelCreditos"
          position="0 3 -0.16"
          rotation="0 180 0"
          width="7"
          height="4"
          material="shader: flat; transparent: true"
        ></a-image>
        <a-box position="2 1 -0.15" scale="0.2 3 0.2" color="#a85432"></a-box
        ><a-box position="-2 1 -0.15" scale="0.2 3 0.2" color="#a85432"></a-box>
        <!-- Cubo de debug: oculto detrás del cartel (-Z local). Al clickearlo togglea
             el visor de colisiones + spawn points invisibles. Ver debug-visor-toggle.
             z -0.22 (antes -0.067): tiene que quedar MÁS atrás que #mainCartelBack
             (z -0.16), si no el cartel de créditos lo tapa desde atrás y deja de ser
             clickeable — que es el único lado desde el que se llega. -->
        <a-box
          id="debugToggleCube"
          class="clickable"
          position="2.771 4.384 -0.22"
          scale="0.4 0.4 0.06"
          color="#FFFFFF"
          material="shader: flat; color: #8c2f1c"
          debug-visor-toggle
        ></a-box>
      </a-entity>

      <!-- Map / scenario model -->
      <a-entity
        id="scenario"
        gltf-model="#islaModel"
        position="0 0.01304 0"
        rotation="0 180 0"
        scale="5 5 5"
        shadow="receive: true; cast: false"
      ></a-entity>

      <!-- Safari hunt animals — scattered across the map, hidden until Safari mode -->
      <a-entity id="huntAnimals" visible="false">
        <a-entity
          id="flamengo"
          class="clickable animal"
          data-animal-type="flamingo"
          gltf-model="#flamengoModel"
          position="-6.064 0 -16.33"
          rotation="0 195.6 0"
          scale="2 2 2"
          animation-mixer="clip: idle"
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #flamengoSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
        <a-entity
          id="jaguarete"
          class="clickable animal"
          data-animal-type="jaguarete"
          gltf-model="#jaguareteModel"
          position="-6.811 0 11.697"
          rotation="0 -45 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #jaguareteSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
        <a-entity
          id="nandu"
          class="clickable animal"
          data-animal-type="nandu"
          gltf-model="#nanduModel"
          position="11.083 0 -0.757"
          rotation="0 163 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="jurumi"
          class="clickable animal"
          data-animal-type="jurumi"
          gltf-model="#jurumiModel"
          position="-14.175 0 0.825"
          rotation="0 208.28 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"

          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="tagua"
          class="clickable animal"
          data-animal-type="tagua"
          gltf-model="#taguaModel"
          position="2.993 0 9.266"
          rotation="0 45 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="tatu"
          class="clickable animal"
          data-animal-type="tatu"
          gltf-model="#tatuModel"
          position="7.303 0 -6.838"
          rotation="0 149.7 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #tatuSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
      </a-entity>

      <!-- Spawn points del Safari: marcadores estáticos editables con el Inspector +
           aframe-watcher (ver CLAUDE.md §11). Cada partida, animal-spawner reparte los
           6 animales de #huntAnimals entre estos puntos al azar. Cada marcador define la
           pose (position + rotation); el animal adopta ambas (la flecha del helper marca
           hacia dónde mirará). Invisibles en el juego; se revelan con el cubo de debug
           detrás del cartel grande (#debugToggleCube). Sembrados con las 6 posiciones
           originales + extras repartidos — reacomodá/agregá a gusto (id único obligatorio
           para que el watcher los persista). En el origen: pose local = world. -->
      <a-entity id="spawnPoints">

          id="spawn-0"
          position="-5.878 0 -20.027"
          rotation="0 195.6 0"
          spawn-point

          rotation="0 -45 0"

          id="spawn-3"
          position="-18.253 0 -1.448"
          rotation="0 208.28 0"

        ></a-entity>

          rotation="0 45 0"
          spawn-point

        <a-entity
          id="spawn-5"

      <!-- Idle showcase animals — arc to the player's right (+X), each rotated to face

        <a-entity

          data-animal-type="jaguarete"
          gltf-model="#jaguareteModel"

          animation-mixer
          staggered-start="maxOffset: 1.6"

        <a-entity
          id="showcase-nandu"

          gltf-model="#nanduModel"

            position="0 0.2 -0.09"
            rotation="-45 0 0"
            width="0.42"
            height="0.42"
            visible="false"
            material="shader: flat; transparent: true; side: double"
            render-on-top
          >
            <!-- Icono hexagonal sobre el hueco que la ficha deja arriba del
                 nombre. Mismas medidas que la versión DOM, llevadas a metros:
                 lado 0.2641×0.42 y centro a 0.3176×0.42 del centro hacia arriba.
                 render-on-top apaga el depthTest, así que el z solo NO alcanza:
                 con el mismo renderOrder que la ficha el icono se dibujaba
                 debajo. Por eso lleva su propio render-on-top con order mayor
                 (el del padre respeta a los hijos que declaran el suyo), más un
                 pelín de z para que tampoco haya z-fighting si algún día se
                 vuelve a activar el depth test. -->
            <a-image

              width="0.111"
              height="0.111"
              position="0 0.133 0.004"
              material="shader: flat; transparent: true; side: double"
              render-on-top="order: 1000"
