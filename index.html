<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No Estan Solos 360° VR | Zet Studios</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="module" src="/src/main.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .hint {
        position: absolute;
        left: 8px;
        top: 8px;
        color: white;
        font-family: sans-serif;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 8px;
        border-radius: 4px;
        z-index: 10;
      }

      /* Desktop animal info card — fixed to the right corner, hidden by default. */
      .info-card {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%) translateX(20px);
        width: 280px;
        color: #fff;
        font-family: sans-serif;
        background: rgba(20, 35, 20, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 16px 18px 18px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      .info-card--visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) translateX(0);
      }
      .info-card__close {
        position: absolute;
        top: 8px;
        right: 10px;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 2px;
      }
      .info-card__close:hover {
        color: #fff;
      }
      .info-card__icon {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 8px;
        object-fit: contain;
      }
      .info-card__name {
        margin: 0 0 12px;
        font-size: 18px;
        text-align: center;
      }
      .info-card__fields {
        margin: 0;
      }
      .info-card__fields > div {
        margin-bottom: 8px;
      }
      .info-card__fields dt {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #ffd178;
        margin-bottom: 1px;
      }
      .info-card__fields dd {
        margin: 0;
        font-size: 13px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      WASD / flechas para moverte. Haz click al cartel de Safari y busca los 6
      animales.
    </div>

    <!-- Desktop animal info card (populated/toggled by the animal-info-card component) -->
    <div id="animalInfoCard" class="info-card" aria-hidden="true">
      <button
        id="animalInfoCardClose"
        class="info-card__close"
        aria-label="Cerrar"
        type="button"
      >
        ✕
      </button>
      <img id="animalInfoCardIcon" class="info-card__icon" src="" alt="" />
      <h2 id="animalInfoCardName" class="info-card__name"></h2>
      <dl class="info-card__fields">
        <div>
          <dt>Nombre científico</dt>
          <dd id="animalInfoCardSci"></dd>
        </div>
        <div>
          <dt>Estado de Conservación</dt>
          <dd id="animalInfoCardCons"></dd>
        </div>
        <div>
          <dt>Nutrición</dt>
          <dd id="animalInfoCardNut"></dd>
        </div>
        <div>
          <dt>Hábitat</dt>
          <dd id="animalInfoCardHab"></dd>
        </div>
      </dl>
    </div>

    <!-- fog="type: exponential; color: #FFD178; density: 0.02"-->>

    <a-scene
      fog="type: exponential; color: #f5dca6; density: 0.02"
      background="color: #FFD178"
      renderer="antialias: true; 
                colorManagement: true; 
                sortObjects: true; 
                physicallyCorrectLights: false;
                powerPreference: high-performance;
                precision: mediump;
                logarithmicDepthBuffer: false"
      vr-mode-ui="enabled: true"
      webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
      inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js"
      shadow-control="enabled: false"
      audio-unlock
      collision-manager
      game-modes
      animal-highlighter
    >
      <!-- Safari Game Manager -->
      <a-entity
        id="gameManager"
        safari-game-manager="timeLimit: 120"
        environment-degradation
      ></a-entity>

      <a-assets>
        <!-- Model assets -->
        <a-asset-item
          id="samuuModel"
          src="assets/models/samuu.glb"
        ></a-asset-item>
        <a-asset-item
          id="samuuCanopyModel"
          src="assets/models/samuu-canopy.glb"
        ></a-asset-item>
        <a-asset-item
          id="jaguareteModel"
          src="assets/models/jaguarete.glb"
        ></a-asset-item>
        <a-asset-item
          id="nanduModel"
          src="assets/models/nandu.glb"
        ></a-asset-item>
        <a-asset-item
          id="flamengoModel"
          src="assets/models/flamengo.glb"
        ></a-asset-item>
        <a-asset-item
          id="jurumiModel"
          src="assets/models/jurumi.glb"
        ></a-asset-item>
        <a-asset-item
          id="taguaModel"
          src="assets/models/tagua.glb"
        ></a-asset-item>
        <a-asset-item
          id="tatuModel"
          src="assets/models/tatu.glb"
        ></a-asset-item>
        <a-asset-item
          id="islaModel"
          src="assets/models/isla.glb"
        ></a-asset-item>
        <a-asset-item
          id="pastoModel"
          src="assets/models/pasto.glb"
        ></a-asset-item>
        <a-asset-item
          id="karandayTroncoModel"
          src="assets/models/karanday-tronco.glb"
        ></a-asset-item>
        <a-asset-item
          id="karandayHojaModel"
          src="assets/models/karanday-hoja.glb"
        ></a-asset-item>

        <!-- UI assets for animal tracker -->
        <img id="trackerBg" src="assets/ui/tracker-background.png" />
        <img id="flamengoCheck" src="assets/ui/flamengo-check.png" />
        <img id="flamengoUncheck" src="assets/ui/flamengo-uncheck.png" />
        <img id="jaguareteCheck" src="assets/ui/jaguarete-check.png" />
        <img id="jaguareteUncheck" src="assets/ui/jaguarete-uncheck.png" />
        <img id="nanduCheck" src="assets/ui/nandu-check.png" />
        <img id="nanduUncheck" src="assets/ui/nandu-uncheck.png" />
        <img id="jurumiCheck" src="assets/ui/jurumi-check.png" />
        <img id="jurumiUncheck" src="assets/ui/jurumi-uncheck.png" />
        <img id="taguaCheck" src="assets/ui/tagua-check.png" />
        <img id="taguaUncheck" src="assets/ui/tagua-uncheck.png" />
        <img id="tatuCheck" src="assets/ui/tatu-check.png" />
        <img id="tatuUncheck" src="assets/ui/tatu-uncheck.png" />

        <!-- Cartel images -->
        <img id="cartelSafari" src="assets/img/cartel-safari.png" />
        <img id="cartelMain" src="assets/img/cartel-main.png" />

        <!-- Audio assets -->
        <audio
          id="ambienceSound"
          src="assets/sfx/ambience.mp3"
          preload="auto"
        ></audio>
        <audio id="tatuSound" src="assets/sfx/tatu.mp3" preload="auto"></audio>
        <audio
          id="flamengoSound"
          src="assets/sfx/flamengo.mp3"
          preload="auto"
        ></audio>
        <audio
          id="jaguareteSound"
          src="assets/sfx/jaguarete.mp3"
          preload="auto"
        ></audio>

        <!-- Game sound effects -->
        <audio
          id="gameStartSound"
          src="assets/sfx/game-start.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameFoundSound"
          src="assets/sfx/game-found.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameWinSound"
          src="assets/sfx/game-win.mp3"
          preload="auto"
        ></audio>
        <audio
          id="gameOverSound"
          src="assets/sfx/game-over.mp3"
          preload="auto"
        ></audio>
        <audio id="fireSound" src="assets/sfx/fire.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Sky -->
      <a-sky id="sky" color="#87ceeb"></a-sky>

      <!-- Ambient Sound - plays everywhere in the background -->
      <a-entity
        id="ambientSound"
        sound="src: #ambienceSound; autoplay: true; loop: true; volume: 0.3; positional: false"
        position="0 0 0"
      ></a-entity>

      <!-- Game Sound Effects (triggered by events) -->
      <a-entity id="gameSoundEffects" position="0 0 0">
        <a-entity
          id="soundGameStart"
          sound="src: #gameStartSound; autoplay: false; volume: 0.6; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameFound"
          sound="src: #gameFoundSound; autoplay: false; volume: 0.5; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameWin"
          sound="src: #gameWinSound; autoplay: false; volume: 0.7; positional: false"
        ></a-entity>
        <a-entity
          id="soundGameOver"
          sound="src: #gameOverSound; autoplay: false; volume: 0.6; positional: false"
        ></a-entity>
        <!-- Burning-forest loop: environment-degradation plays it during a Safari
             round and ramps its volume up with the timer (see component). -->
        <a-entity
          id="soundFire"
          sound="src: #fireSound; autoplay: false; loop: true; volume: 0; positional: false"
        ></a-entity>
      </a-entity>

      <!-- Lighting: hemisphere ambient + directional sun (shadows enabled in script) -->
      <a-entity
        light="type: hemisphere; color: #ffffff; groundColor: #556655; intensity: 0.8"
      ></a-entity>

      <a-entity
        id="sun"
        light="type: directional; color: #ffffff; intensity: 1.3; castShadow: true"
        position="0 50 0"
        rotation="0 0 0"
      ></a-entity>

      <!-- Ocean using a-ocean component 
      <a-ocean
        width="500"
        depth="500"
        density="20"
        opacity="1"
        position="30 -0.5 -10"
        color="#16e9aa"
      ></a-ocean> -->

      <!-- Ground (slightly raised) 
      <a-entity
        geometry="primitive: circle; radius: 50; segments: 32"
        material="color: #96d165"
        shadow="receive: true"
        rotation="-90 0 0"
        position="0 0.01 0"
      ></a-entity> -->

      <!-- Player Collision Boundary Ring -->
      <a-entity
        id="boundaryRing"
        visible="false"
        geometry="primitive: cylinder; radius: 53.1; height: 10; openEnded: true; thetaStart: 0; thetaLength: 500"
        material="color: #0066ff; transparent: true; opacity: 0.2; side: double"
        position="0 5 0"
        static-body
      ></a-entity>

      <!-- Marcador de destino del teleport por gestos (pinch-teleport). Hijo de la escena
           para que sus coords locales coincidan con las del mundo. Oculto por defecto. -->
      <a-entity
        id="teleportMarker"
        visible="false"
        geometry="primitive: ring; radiusInner: 0.25; radiusOuter: 0.35; segmentsTheta: 32"
        material="shader: flat; color: #00FF88; opacity: 0.8; transparent: true; side: double"
        rotation="-90 0 0"
        position="0 0.02 0"
      ></a-entity>

      <!-- Safari Game Control Orbs -->
      <a-entity id="carteles" position="0 1.5 -5">
        <!-- Safari Cartel -->
        <a-entity
          id="startCartel"
          shadow="receive: false"
          position="-4.5 0 0"
          collision-cube="width: 1; depth: 0.3; height: 10; offsetY: 0"
        >
          <a-image
            id="startCartelImg"
            class="clickable orb-start"
            src="#cartelSafari"
            position="0 0 0"
            width="1"
            height="1.4"
            shadow="cast: true"
            material="shader: flat; transparent: true"
            orb-controller
          ></a-image>
          <a-box
            position="0 -1 -0.15"
            scale="0.2 3 0.2"
            color="#a85432"
          ></a-box>
          <a-box
            position="0 0 -0.03"
            scale="0.9 1.3 0.05"
            color="#a85432"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- Main Cartel -->

      <a-entity
        id="mainCartelGrande"
        position="0 0 -5"
        collision-cube="width: 7; depth: 0.3; height: 16 offsetY: -10"
      >
        <!-- Decorative welcome banner (no longer interactive: flight is now always-on,
             so there is no Vuelo mode to exit). -->
        <a-image
          id="mainCartel"
          geometry="width: 7"
          src="#cartelMain"
          position="0 3 0"
          width="7"
          height="4"
          shadow="cast: true"
          material="shader: flat; transparent: true"
        ></a-image>
        <a-box
          position="0 3 -0.03"
          scale="6.5 3.5 0.05"
          color="#a85432"
        ></a-box>
        <a-box position="2 1 -0.15" scale="0.2 3 0.2" color="#a85432"></a-box
        ><a-box position="-2 1 -0.15" scale="0.2 3 0.2" color="#a85432"></a-box>
        <!-- Cubo de debug: oculto detrás del cartel (-Z local). Al clickearlo togglea
             el visor de colisiones + spawn points invisibles. Ver debug-visor-toggle. -->
        <a-box
          id="debugToggleCube"
          class="clickable"
          position="0 1 -1"
          scale="0.4 0.4 0.4"
          color="#FFFFFF"
          material="shader: flat"
          debug-visor-toggle
        ></a-box>
      </a-entity>

      <!-- Map / scenario model -->
      <a-entity
        id="scenario"
        gltf-model="#islaModel"
        position="0 0.01304 0"
        rotation="0 180 0"
        scale="10 10 10"
        shadow="receive: true; cast: false"
      ></a-entity>

      <!-- Safari hunt animals — scattered across the map, hidden until Safari mode -->
      <a-entity id="huntAnimals" visible="false">
        <a-entity
          id="flamengo"
          class="clickable animal"
          data-animal-type="flamingo"
          gltf-model="#flamengoModel"
          position="-12.12801 0 -32.65917"
          rotation="0 195.6 0"
          scale="2 2 2"
          animation-mixer="clip: idle"
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #flamengoSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
        <a-entity
          id="jaguarete"
          class="clickable animal"
          data-animal-type="jaguarete"
          gltf-model="#jaguareteModel"
          position="-13.62112 0 23.39443"
          rotation="0 -45 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #jaguareteSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
        <a-entity
          id="nandu"
          class="clickable animal"
          data-animal-type="nandu"
          gltf-model="#nanduModel"
          position="22.16629 0 -1.51447"
          rotation="0 163 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="jurumi"
          class="clickable animal"
          data-animal-type="jurumi"
          gltf-model="#jurumiModel"
          position="-28.34973 0 1.64968"
          rotation="0 208.28 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="tagua"
          class="clickable animal"
          data-animal-type="tagua"
          gltf-model="#taguaModel"
          position="5.98673 0 18.53104"
          rotation="0 45 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
        ></a-entity>
        <a-entity
          id="tatu"
          class="clickable animal"
          data-animal-type="tatu"
          gltf-model="#tatuModel"
          position="14.60573 0 -13.67693"
          rotation="0 149.7 0"
          scale="2 2 2"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          performance-optimizer="nearDistance: 15; midDistance: 30; farDistance: 50"
          material-optimizer
          animal-clickable
          sound="src: #tatuSound; autoplay: true; loop: true; volume: 0.8; positional: true; refDistance: 5; maxDistance: 30; rolloffFactor: 1"
        ></a-entity>
      </a-entity>

      <!-- Spawn points del Safari: marcadores estáticos editables con el Inspector +
           aframe-watcher (ver CLAUDE.md §11). Cada partida, animal-spawner reparte los
           6 animales de #huntAnimals entre estos puntos al azar. Cada marcador define la
           pose (position + rotation); el animal adopta ambas (la flecha del helper marca
           hacia dónde mirará). Invisibles en el juego; se revelan con el cubo de debug
           detrás del cartel grande (#debugToggleCube). Sembrados con las 6 posiciones
           originales + extras repartidos — reacomodá/agregá a gusto (id único obligatorio
           para que el watcher los persista). En el origen: pose local = world. -->
      <a-entity id="spawnPoints">
        <a-entity
          id="spawn-0"
          position="-15.139 0 -36.297"
          rotation="0 195.6 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-1"
          position="-21.901 0 32.177"
          rotation="0 -45 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-2"
          position="33.709 0 -10.798"
          rotation="0 163 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-3"
          position="-36.505 0 -0.483"
          rotation="0 208.28 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-4"
          position="4.607 0 17.026"
          rotation="0 45 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-5"
          position="26.273 0 10.913"
          rotation="0 149.7 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-6"
          position="24.856 0 27.151"
          rotation="0 220 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-7"
          position="-38.908 0 -13.96"
          rotation="0 60 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-8"
          position="3.638 0 43.029"
          rotation="0 0 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-9"
          position="24.967 0 -35.269"
          rotation="0 300 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-10"
          position="-1.506 0 -18.553"
          rotation="0 120 0"
          spawn-point
        ></a-entity>
        <a-entity
          id="spawn-11"
          position="8 0 -26"
          rotation="0 180 0"
          spawn-point
        ></a-entity>
      </a-entity>

      <!-- Idle showcase animals — arc to the player's right (+X), each rotated to face
           the player. Clicking any opens its info card. Hidden once Safari mode starts. -->
      <a-entity id="showcaseAnimals">
        <a-entity
          class="clickable animal"
          data-animal-type="flamingo"
          gltf-model="#flamengoModel"
          position="5.7 0 1.5"
          rotation="0 75 0"
          scale="1.5 1.5 1.5"
          animation-mixer="clip: idle"
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
        <a-entity
          class="clickable animal"
          data-animal-type="jaguarete"
          gltf-model="#jaguareteModel"
          position="5.7 0 0"
          rotation="0 90 0"
          scale="1.5 1.5 1.5"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
        <a-entity
          class="clickable animal"
          data-animal-type="nandu"
          gltf-model="#nanduModel"
          position="5.7 0 -1.5"
          rotation="0 105 0"
          scale="1.5 1.5 1.5"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
        <a-entity
          class="clickable animal"
          data-animal-type="jurumi"
          gltf-model="#jurumiModel"
          position="-5.7 0 1.5"
          rotation="0 285 0"
          scale="1.5 1.5 1.5"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
        <a-entity
          class="clickable animal"
          data-animal-type="tagua"
          gltf-model="#taguaModel"
          position="-5.7 0 0"
          rotation="0 270 0"
          scale="1.5 1.5 1.5"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
        <a-entity
          class="clickable animal"
          data-animal-type="tatu"
          gltf-model="#tatuModel"
          position="-5.7 0 -1.5"
          rotation="0 255 0"
          scale="1.5 1.5 1.5"
          animation-mixer
          staggered-start="maxOffset: 1.6"
          animal-clickable
        ></a-entity>
      </a-entity>

      <!-- Camera rig with WASD and VR controls -->
      <a-entity
        id="cameraRig"
        position="0 0 0"
        movement-controls="enabled: true; speed: 0.2;"
        vr-locomotion="controllerHand: left"
        flight-locomotion
        pinch-teleport="hand: left; maxRange: 60"
        boundary-collision="radius: 60"
        collision-responder="padding: 0.3"
        screen-fade="fadeDuration: 1000"
        safari-compass
        animal-info-card
      >
        <!-- Camera -->
        <a-entity
          id="head"
          camera
          look-controls="pointerLockEnabled: false"
          position="0 1.6 0"
          wasd-controls="enabled: false"
          raycaster="objects: .clickable, .animal; far: 20"
          cursor="fuse: false; rayOrigin: mouse"
        >
          <!-- Directional compass HUD — strip of animal icons in front of the
               player. Each icon's X is driven every frame by safari-compass to
               point toward that animal; found animals are hidden. -->
          <a-entity id="compassUI" position="0 0.32 -1" visible="false">
            <!-- Animal direction icons (full-colour). Initial X is cosmetic;
                 safari-compass repositions them by bearing each frame. -->
            <a-plane
              id="compassIcon-flamingo"
              src="#flamengoCheck"
              width="0.09"
              height="0.09"
              position="-0.5 0 0"
              material="shader: flat; transparent: true"
            ></a-plane>
            <a-plane
              id="compassIcon-jaguarete"
              src="#jaguareteCheck"
              width="0.09"
              height="0.09"
